<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Stay focused — Focus Guard</title>
  <link rel="stylesheet" href="../focus-page.css">
</head>
<body>
  <div class="wallpaper"><img id="wallpaper-img" alt=""></div>
  <main class="stage">
    <div class="card">
      <p class="eyebrow">Focus Guard</p>
      <h1 id="headline">This site is blocked</h1>
      <p class="detail" id="detail"></p>
      <p class="countdown hidden" id="countdown"></p>
      <p class="countdown-note hidden" id="countdown-note"></p>
      <p class="quote" id="quote"></p>
      <p class="quote-author" id="quote-author"></p>
      <div class="actions">
        <button class="btn btn-primary" id="btn-back">Back to work</button>
        <button class="btn hidden" id="btn-continue">Continue anyway</button>
        <button class="btn hidden" id="btn-dose">Request free time</button>
        <a class="btn btn-ghost" id="btn-settings" href="#">Settings</a>
      </div>
    </div>
  </main>
  <script type="module" src="blocked-main.js"></script>
</body>
</html>
